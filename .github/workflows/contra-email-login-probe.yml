name: Contra Email Login Probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/contra-email-login-trigger.txt"

permissions:
  contents: read

jobs:
  email-login-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CONTRA_LOGIN_EMAIL: ${{ secrets.CONTRA_LOGIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Python only
        run: pip install playwright==1.55.0
      - name: Submit normal Contra email login once
        run: |
          python - <<'PY'
          import json, os, re
          from playwright.sync_api import sync_playwright

          email=os.environ.get('CONTRA_LOGIN_EMAIL','').strip()
          def clean(v): return re.sub(r'\s+',' ',v or '').strip()
          def safe(v): return clean(v).replace(email,'[EMAIL]') if email else clean(v)
          def first(page, selectors):
              for s in selectors:
                  loc=page.locator(s)
                  if loc.count():
                      n=loc.first
                      try:
                          if n.is_visible(): return n
                      except Exception: pass
              return None
          def buttons(page, limit=20):
              out=[]
              loc=page.locator("button, [role='button'], input[type='submit']")
              for i in range(min(loc.count(),limit*3)):
                  n=loc.nth(i)
                  try:
                      if not n.is_visible(): continue
                      t=safe(n.inner_text())[:120]
                  except Exception: continue
                  if t and t not in out: out.append(t)
                  if len(out)>=limit: break
              return out
          def inputs(page):
              out=[]
              loc=page.locator('input')
              for i in range(min(loc.count(),20)):
                  n=loc.nth(i)
                  try:
                      if not n.is_visible(): continue
                  except Exception: continue
                  m={}
                  for k in ('type','name','id','autocomplete','placeholder','inputmode'):
                      v=n.get_attribute(k)
                      if v: m[k]=safe(v)[:120]
                  out.append(m)
              return out

          result={'status':'missing_secret' if not email else 'starting'}
          if email:
              try:
                  with sync_playwright() as p:
                      browser=p.chromium.launch(channel='chrome',headless=True)
                      page=browser.new_page()
                      page.goto('https://contra.com/',wait_until='domcontentloaded',timeout=45000)
                      page.wait_for_timeout(900)
                      login=first(page,["a:has-text('Log in')","button:has-text('Log in')","a:has-text('Sign in')","button:has-text('Sign in')"])
                      if login is None:
                          result={'status':'login_entry_not_found'}
                      else:
                          login.click(); page.wait_for_timeout(800)
                          field=first(page,["#emailAddress","input[type='email']","input[placeholder*='email' i]"])
                          if field is None:
                              result={'status':'email_field_not_found','buttons':buttons(page),'inputs':inputs(page)}
                          else:
                              field.fill(email)
                              submit=first(page,[
                                  "form:has(#emailAddress) button[type='submit']",
                                  "button[type='submit']",
                                  "button:has-text('Continue')",
                                  "button:has-text('Log in')",
                                  "button:has-text('Sign in')",
                                  "button:has-text('Email')",
                              ])
                              if submit is None:
                                  try:
                                      field.press('Enter')
                                      submitted=True
                                  except Exception:
                                      submitted=False
                              else:
                                  submit.click(); submitted=True
                              if not submitted:
                                  result={'status':'submit_not_found','buttons':buttons(page),'inputs':inputs(page)}
                              else:
                                  page.wait_for_timeout(2200)
                                  body=safe(page.locator('body').inner_text()) if page.locator('body').count() else ''
                                  low=body.lower()
                                  otp=first(page,["input[autocomplete='one-time-code']","input[name*='code' i]","input[id*='code' i]","input[inputmode='numeric']"])
                                  result={
                                      'status':'otp_required' if otp is not None or any(x in low for x in ('verification code','enter the code','security code','code sent')) else ('email_link_required' if any(x in low for x in ('check your email','email link','magic link')) else 'post_submit_unclassified'),
                                      'url':page.url,
                                      'otp_field_present':otp is not None,
                                      'buttons':buttons(page),
                                      'inputs':inputs(page),
                                      'markers':{
                                          'check_email':'check your email' in low,
                                          'verification_code':'verification code' in low or 'enter the code' in low,
                                          'magic_link':'magic link' in low or 'email link' in low,
                                          'captcha':any(x in low for x in ('captcha','verify you are human','cloudflare')),
                                      },
                                  }
                      browser.close()
              except Exception as e:
                  result={'status':'probe_error','error_type':type(e).__name__,'message':safe(str(e))[:300]}

          print('CONTRA_EMAIL_LOGIN_JSON='+json.dumps(result,ensure_ascii=False))
          with open('contra-email-login.json','w',encoding='utf-8') as f: json.dump(result,f,ensure_ascii=False,indent=2)
          PY
      - name: Upload safe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contra-email-login-probe
          path: contra-email-login.json
          if-no-files-found: warn
          retention-days: 1
