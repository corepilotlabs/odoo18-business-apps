name: Contra Live Login Bridge

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/contra-email-login-trigger.txt"

permissions:
  contents: read
  issues: write

jobs:
  contra-live-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CONTRA_LOGIN_EMAIL: ${{ secrets.CONTRA_LOGIN_EMAIL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_ISSUE: ${{ github.event.pull_request.number }}
      GH_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: pip install playwright==1.55.0 requests==2.32.4 cryptography
      - name: Run encrypted Contra bridge
        run: python tools/contra_live_bridge.py
      - name: Upload safe bridge result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contra-live-result
          path: contra-live-result.json
          if-no-files-found: warn
          retention-days: 1
