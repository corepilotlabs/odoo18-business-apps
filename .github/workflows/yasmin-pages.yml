name: Yasmin Judge Demo Pages

# GitHub Pages requires one-time repository-level enablement that the connected
# GitHub App cannot perform. Keep this workflow manual until Pages is enabled.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pages not enabled
        run: |
          echo "GitHub Pages needs one-time repository Settings enablement."
          echo "The public branch and downloadable judge artifact remain available."
          exit 1
